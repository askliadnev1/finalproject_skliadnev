[project]
name = "finalproject_skliadnev_m26-555"
version = "0.1.0"
description = "ValutaTrade Hub — платформа для отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.10",
    "requests>=2.32",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = ["ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
history_file = "data/exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_level = "INFO"
log_max_bytes = 1000000
log_backup_count = 5